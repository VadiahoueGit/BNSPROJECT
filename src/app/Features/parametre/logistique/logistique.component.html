<div class="log-back-row" (click)="goBack()">
  <div class="log-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="log-back-title">Logistique</h4>
</div>

<div class="log-tabs mb-3">
  <button class="log-tab-btn" [class.active]="activeTab === 'transporteurs'" (click)="activeElement('transporteurs')">Transporteurs</button>
  <button class="log-tab-btn" [class.active]="activeTab === 'vehicules'" (click)="activeElement('vehicules')">Véhicules</button>
</div>

<div *ngIf="activeTab === 'transporteurs'">
  <app-transporteur></app-transporteur>
</div>

<div *ngIf="activeTab === 'vehicules'">
  <app-vehicules></app-vehicules>
</div>
