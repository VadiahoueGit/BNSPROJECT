<div class="qv-header">
  <div class="qv-title">
    <button class="qv-back-btn" (click)="goBack()"><i class="fas fa-chevron-left"></i></button>
    <h4>Questions visite</h4>
  </div>
  <button class="qv-btn-primary" (click)="OnCreate()">
    <i class="fas fa-plus"></i> Nouvelle question
  </button>
</div>

<div class="qv-card">
  <div class="qv-topbar">
    <div>
      <div class="qv-card-title"><i class="fas fa-question-circle"></i> Liste des questions</div>
      <div class="qv-count">{{ dataList.length }} résultat(s)</div>
    </div>
  </div>

  <p-table [styleClass]="'qv-ptable p-datatable-sm'" [value]="dataList" dataKey="id"
           [totalRecords]="totalPages" [lazy]="true" [rows]="8"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th style="width:85%">Question</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.texte }}</td>
        <td class="text-center">
          <div style="display:flex;gap:6px;justify-content:center">
            <button class="qv-action-btn edit" (click)="OnEdit(row)" title="Modifier"><i class="fas fa-edit"></i></button>
            <button class="qv-action-btn del" (click)="OnDelete(row.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2" style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">
          <i class="fas fa-question-circle" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>
          Aucune question trouvée.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="qv-modal">
    <div class="qv-modal-header">
      <div class="qv-modal-icon"><i class="fas fa-question-circle"></i></div>
      <h5 class="qv-modal-title">
        {{ operation === 'create' ? 'Nouvelle question' : 'Modifier la question' }}
      </h5>
      <button class="qv-modal-close" (click)="OnCloseModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="qv-modal-body">
      <form [formGroup]="questionForm">
        <div class="qv-field">
          <label class="qv-field-label">Question *</label>
          <textarea class="qv-field-textarea" formControlName="texte" placeholder="Entrez la question"></textarea>
        </div>
      </form>
    </div>
    <div class="qv-modal-footer">
      <button class="qv-btn-secondary" (click)="OnCloseModal()">Annuler</button>
      <button class="qv-btn-submit" (click)="onSubmit()">
        <i class="fas fa-check"></i> {{ operation === 'create' ? 'Créer' : 'Enregistrer' }}
      </button>
    </div>
  </div>
</div>
