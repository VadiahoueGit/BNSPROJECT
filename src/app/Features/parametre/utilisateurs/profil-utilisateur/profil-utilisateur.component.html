<div class="pu-card">
  <div class="pu-topbar">
    <span class="pu-title">Profils utilisateurs</span>
    <button class="pu-btn-add" (click)="OnCreate()">
      <i class="fas fa-plus me-1"></i> Créer un profil
    </button>
  </div>

  <p-table [styleClass]="'pu-ptable p-datatable-sm'" #dt2 [value]="dataList" dataKey="id"
           [rows]="8" [totalRecords]="totalPages" [lazy]="true"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Profil</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-dataList>
      <tr>
        <td>{{ dataList.name }}</td>
        <td>{{ dataList.description }}</td>
        <td>
          <div class="pu-actions">
            <button class="pu-action-btn edit" (click)="OnEdit(dataList)" title="Modifier"><i class="fas fa-pen"></i></button>
            <button class="pu-action-btn del" (click)="OnDelete(dataList.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="3">Aucun profil trouvé.</td></tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header d-flex align-items-center">
        <div class="d-flex justify-content-center align-items-center"
             style="background-color:rgb(219,255,232);border-radius:3rem;width:3rem;height:3rem;">
          <i class="fas fa-box-check text-primary fs-3"></i>
        </div>
        <h1 *ngIf="operation == 'create'" class="modal-title fs-5 ms-3">Création du profil</h1>
        <h1 *ngIf="operation == 'edit'" class="modal-title fs-5 ms-3">Modification du profil</h1>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-4">
            <form [formGroup]="ProfilForm">
              <div class="mb-3">
                <label class="form-label">Profil <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="name" placeholder="Entrez le profil">
              </div>
              <div class="mb-3">
                <label class="form-label">Description <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="description" placeholder="Entrez la description">
              </div>
            </form>
          </div>
          <div class="col-md-8">
            <div class="mb-3">
              <form [formGroup]="searchForm">
                <label class="form-label">Permissions <span class="text-danger">*</span></label>
                <input type="text" placeholder="Recherche" class="form-control" formControlName="searchQuery" (input)="filterData()"/>
              </form>
              <div class="table-responsive" style="max-height:300px;overflow-y:auto;">
                <table class="table">
                  <thead>
                    <tr style="font-size:small;">
                      <th>Module</th>
                      <th class="text-center">Consultation</th>
                      <th class="text-center">Création</th>
                      <th class="text-center">Modification</th>
                      <th class="text-center">Suppression</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of filteredPermissionList; let i = index" style="font-size:small;">
                      <td>
                        {{ item.name }}
                        <div class="text-muted" style="font-size:11px">{{ item.description }}</div>
                      </td>
                      <td class="text-center"><input type="checkbox" [name]="'voir_' + i" [(ngModel)]="item.peutVoir"></td>
                      <td class="text-center"><input type="checkbox" [name]="'creer_' + i" [(ngModel)]="item.peutCreer"></td>
                      <td class="text-center"><input type="checkbox" [name]="'modifier_' + i" [(ngModel)]="item.peutModifier"></td>
                      <td class="text-center"><input type="checkbox" [name]="'supprimer_' + i" [(ngModel)]="item.peutSupprimer"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer gap-3 px-4">
        <button (click)="OnCloseModal()" type="button" class="btn btn-secondary px-2">Annuler</button>
        <button type="submit" (click)="onSubmit()" class="btn btn-primary px-2">Valider</button>
      </div>
    </div>
  </div>
</div>
