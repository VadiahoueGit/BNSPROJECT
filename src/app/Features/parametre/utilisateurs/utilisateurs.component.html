<div class="usr-back-row" (click)="goBack()">
  <div class="usr-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="usr-back-title">Utilisateurs</h4>
</div>

<div class="usr-tabs mb-3">
  <button class="usr-tab-btn" [class.active]="activeTab === 'profilutilisateur'" (click)="activeElement('profilutilisateur')">Profils utilisateurs</button>
  <button class="usr-tab-btn" [class.active]="activeTab === 'utilisateur'" (click)="activeElement('utilisateur')">Utilisateurs</button>
</div>

<div *ngIf="activeTab === 'profilutilisateur'">
  <app-profil-utilisateur></app-profil-utilisateur>
</div>

<div *ngIf="activeTab === 'utilisateur'">
  <app-utilisateur></app-utilisateur>
</div>
