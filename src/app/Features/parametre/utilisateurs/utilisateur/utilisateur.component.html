<div class="ut-card">
  <div class="ut-topbar">
    <span class="ut-title">Utilisateurs</span>
    <button class="ut-btn-add" (click)="OnCreate()">
      <i class="fas fa-plus me-1"></i> Créer un utilisateur
    </button>
  </div>

  <p-table [styleClass]="'ut-ptable p-datatable-sm'" #dt2 [value]="dataList" dataKey="id"
    [rows]="8" [totalRecords]="totalPages" [lazy]="true"
    [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Photo</th>
        <th>Nom</th>
        <th>Prénoms</th>
        <th>Email</th>
        <th>Tél principal</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-dataList>
      <tr>
        <td>{{ dataList.profilePhoto ?? null }}</td>
        <td>{{ dataList.nom }}</td>
        <td>{{ dataList.prenoms }}</td>
        <td>{{ dataList.email }}</td>
        <td>{{ dataList.telephone_one }}</td>
        <td>{{ dataList.role.name }}</td>
        <td>
          <div class="ut-actions">
            <button class="ut-action-btn edit" (click)="OnEdit(dataList)" title="Modifier"><i class="fas fa-pen"></i></button>
            <button class="ut-action-btn del" (click)="OnDelete(dataList.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7">Aucun utilisateur trouvé.</td></tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header d-flex align-items-center">
        <div class="d-flex justify-content-center align-items-center"
          style="background-color:rgb(219,255,232);border-radius:3rem;width:3rem;height:3rem;">
          <i class="fas fa-box-check text-primary fs-3"></i>
        </div>
        <h1 *ngIf="operation == 'create'" class="modal-title fs-5 ms-3">Création d'utilisateur</h1>
        <h1 *ngIf="operation == 'edit'" class="modal-title fs-5 ms-3">Modification de l'utilisateur</h1>
      </div>
      <div class="modal-body">
        <form [formGroup]="UserForm">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Photo <span class="text-danger">*</span></label>
                <input type="file" class="form-control" formControlName="photo">
              </div>
              <div class="mb-3">
                <label class="form-label">Nom <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="nom" placeholder="Entrez le nom">
              </div>
              <div class="mb-3">
                <label class="form-label">Prénoms <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="prenoms" placeholder="Entrez le prénom">
              </div>
              <div class="mb-3">
                <label class="form-label">Adresse email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" formControlName="email" placeholder="Entrez l'email">
              </div>
              <div class="mb-3">
                <label class="form-label">Numéro de téléphone principal <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="telephone_one" placeholder="Entrez le numéro principal">
              </div>
              <div class="mb-3">
                <label class="form-label">Dépôt <span class="text-danger">*</span></label>
                <select class="form-control form-select form-select-sm" formControlName="depotId">
                  <option value="" disabled selected>Choisir le dépot</option>
                  <option [value]="item.id" *ngFor="let item of dataListDepot">{{item.nomDepot}}</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Numéro de téléphone secondaire <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="telephone_two" placeholder="Entrez le numéro secondaire">
              </div>
              <div class="mb-3">
                <label class="form-label">Mot de passe utilisateur <span class="text-danger">*</span></label>
                <input type="password" class="form-control" formControlName="password" placeholder="Entrez le mot de passe">
              </div>
              <div class="mb-3">
                <label class="form-label">Matricule <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="matricule" placeholder="Entrez le matricule">
              </div>
              <div class="mb-3">
                <label class="form-label">Fonction <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="fonction" placeholder="Entrez la fonction">
              </div>
              <div class="mb-3">
                <label class="form-label">Role <span class="text-danger">*</span></label>
                <select class="form-control form-select form-select-sm" formControlName="roleId">
                  <option value="" disabled selected>Choisir le profil</option>
                  <option [value]="item.id" *ngFor="let item of dataListProfil">{{item.name}}</option>
                </select>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer gap-3 px-4">
        <button (click)="OnCloseModal()" type="button" class="btn btn-secondary px-2">Annuler</button>
        <button type="submit" [disabled]="UserForm.invalid" (click)="onSubmit()" class="btn btn-primary px-2">Valider</button>
      </div>
    </div>
  </div>
</div>
