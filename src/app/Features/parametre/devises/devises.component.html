<div class="dv-header">
  <div class="dv-title">
    <button class="dv-back-btn" (click)="goBack()"><i class="fas fa-chevron-left"></i></button>
    <h4>Devises</h4>
  </div>
  <button class="dv-btn-primary" (click)="OnCreate()">
    <i class="fas fa-plus"></i> Nouvelle devise
  </button>
</div>

<div class="dv-card">
  <div class="dv-topbar">
    <div>
      <div class="dv-card-title"><i class="fas fa-coins"></i> Liste des devises</div>
      <div class="dv-count">{{ currencyList.length }} résultat(s)</div>
    </div>
  </div>

  <p-table [styleClass]="'dv-ptable p-datatable-sm'" [value]="currencyList" dataKey="id"
           [totalRecords]="totalPages" [lazy]="true" [rows]="8"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Libellé</th>
        <th>Valeur</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td><span class="dv-code-badge">{{ row.code }}</span></td>
        <td><span class="dv-name">{{ row.nom }}</span></td>
        <td>{{ row.valeur }} en F CFA</td>
        <td class="text-center">
          <div style="display:flex;gap:6px;justify-content:center">
            <button class="dv-action-btn edit" (click)="OnEdit(row)" title="Modifier"><i class="fas fa-edit"></i></button>
            <button class="dv-action-btn del" (click)="OnDelete(row.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">
          <i class="fas fa-coins" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>
          Aucune devise trouvée.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="dv-modal">
    <div class="dv-modal-header">
      <div class="dv-modal-icon"><i class="fas fa-coins"></i></div>
      <h5 class="dv-modal-title">
        {{ operation === 'create' ? 'Nouvelle devise' : 'Modifier la devise' }}
      </h5>
      <button class="dv-modal-close" (click)="OnCloseModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="dv-modal-body">
      <form [formGroup]="DeviseForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">
          <div class="dv-field">
            <label class="dv-field-label">Nom *</label>
            <input class="dv-field-input" formControlName="nom" placeholder="Entrez le nom" />
          </div>
          <div class="dv-field">
            <label class="dv-field-label">Code *</label>
            <input class="dv-field-input" formControlName="code" placeholder="Ex : XOF" />
          </div>
          <div class="dv-field" style="grid-column: span 2">
            <label class="dv-field-label">Valeur en F CFA *</label>
            <input class="dv-field-input" type="number" formControlName="valeur" placeholder="Entrez la valeur" />
          </div>
        </div>
      </form>
    </div>
    <div class="dv-modal-footer">
      <button class="dv-btn-secondary" (click)="OnCloseModal()">Annuler</button>
      <button class="dv-btn-submit" (click)="onSubmit()">
        <i class="fas fa-check"></i> {{ operation === 'create' ? 'Créer' : 'Enregistrer' }}
      </button>
    </div>
  </div>
</div>
