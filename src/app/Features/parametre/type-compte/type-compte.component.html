<div class="tc-header">
  <div class="tc-title">
    <button class="tc-back-btn" (click)="goBack()"><i class="fas fa-chevron-left"></i></button>
    <h4>Types de compte</h4>
  </div>
  <button class="tc-btn-primary" (click)="OnCreate()">
    <i class="fas fa-plus"></i> Nouveau type de compte
  </button>
</div>

<div class="tc-card">
  <div class="tc-topbar">
    <div>
      <div class="tc-card-title"><i class="fas fa-tags"></i> Liste des types de compte</div>
      <div class="tc-count">{{ totalPages }} résultat(s)</div>
    </div>
    <div class="tc-search-wrap">
      <i class="fas fa-search tc-search-icon"></i>
      <input class="tc-search-input" type="text" (keyup.enter)="filterGlobal($event)" placeholder="Libellé…">
    </div>
  </div>

  <p-table [styleClass]="'tc-ptable p-datatable-sm'" [value]="dataList" dataKey="id"
           [totalRecords]="totalPages" [lazy]="true" [rows]="8"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Libellé</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td><span class="tc-name">{{ row.libelle }}</span></td>
        <td class="text-center">
          <div style="display:flex;gap:6px;justify-content:center">
            <button class="tc-action-btn edit" (click)="OnEdit(row)" title="Modifier"><i class="fas fa-edit"></i></button>
            <button class="tc-action-btn del" (click)="OnDelete(row.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2" style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">
          <i class="fas fa-tags" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>
          Aucun type de compte trouvé.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="tc-modal">
    <div class="tc-modal-header">
      <div class="tc-modal-icon"><i class="fas fa-tags"></i></div>
      <h5 class="tc-modal-title">
        {{ operation === 'create' ? 'Nouveau type de compte' : 'Modifier le type de compte' }}
      </h5>
      <button class="tc-modal-close" (click)="OnCloseModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="tc-modal-body">
      <form [formGroup]="typeCompteForm">
        <div class="tc-field">
          <label class="tc-field-label">Libellé *</label>
          <input class="tc-field-input" formControlName="libelle" placeholder="Ex: Client" />
        </div>
      </form>
    </div>
    <div class="tc-modal-footer">
      <button class="tc-btn-secondary" (click)="OnCloseModal()">Annuler</button>
      <button class="tc-btn-submit" [disabled]="typeCompteForm.invalid" (click)="onSubmit()">
        <i class="fas fa-check"></i> {{ operation === 'create' ? 'Créer' : 'Enregistrer' }}
      </button>
    </div>
  </div>
</div>
