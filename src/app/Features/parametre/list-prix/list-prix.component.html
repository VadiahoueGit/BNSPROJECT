<div class="lp-header">
  <div class="lp-title">
    <button class="lp-back-btn" (click)="goBack()"><i class="fas fa-chevron-left"></i></button>
    <h4>Nom du prix</h4>
  </div>
  <button class="lp-btn-primary" (click)="OnCreate()">
    <i class="fas fa-plus"></i> Créer un prix
  </button>
</div>

<div class="lp-card">
  <div class="lp-topbar">
    <div>
      <div class="lp-card-title"><i class="fas fa-tag"></i> Liste des prix</div>
      <div class="lp-count">{{ dataList.length }} résultat(s)</div>
    </div>
  </div>

  <p-table [styleClass]="'lp-ptable p-datatable-sm'" [value]="dataList" dataKey="id"
           [totalRecords]="totalPages" [lazy]="true" [rows]="8"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Nom</th>
        <th>Date de création</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td><span class="lp-name">{{ row.libelle }}</span></td>
        <td>{{ row.createdAt | date }}</td>
        <td class="text-center">
          <div style="display:flex;gap:6px;justify-content:center">
            <button class="lp-action-btn edit" (click)="OnEdit(row)" title="Modifier"><i class="fas fa-edit"></i></button>
            <button class="lp-action-btn del" (click)="OnDelete(row.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">
          <i class="fas fa-tag" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>
          Aucun prix trouvé.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="lp-modal">
    <div class="lp-modal-header">
      <div class="lp-modal-icon"><i class="fas fa-tag"></i></div>
      <h5 class="lp-modal-title">
        {{ operation === 'create' ? 'Nouveau prix' : 'Modifier le prix' }}
      </h5>
      <button class="lp-modal-close" (click)="OnCloseModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="lp-modal-body">
      <form [formGroup]="prixForm">
        <div class="lp-field">
          <label class="lp-field-label">Type de prix *</label>
          <input class="lp-field-input" formControlName="libelle" placeholder="Entrez le type prix" />
        </div>
      </form>
    </div>
    <div class="lp-modal-footer">
      <button class="lp-btn-secondary" (click)="OnCloseModal()">Annuler</button>
      <button class="lp-btn-submit" (click)="onSubmit()">
        <i class="fas fa-check"></i> {{ operation === 'create' ? 'Créer' : 'Enregistrer' }}
      </button>
    </div>
  </div>
</div>
