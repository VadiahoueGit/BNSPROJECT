<div class="bui-back mb-4" (click)="goBack()">
  <div class="bui-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="fw-bold mb-0">Article & prix</h4>
</div>

<div class="cc-tabs mb-3">
  <button class="cc-tab-btn" [class.active]="activeTab === 'groupeProduits'" (click)="activeElement('groupeProduits')">Groupe d'articles</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'typeArticle'" (click)="activeElement('typeArticle')">Types d'articles</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'liquide'" (click)="activeElement('liquide')">Liquides</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'emballage'" (click)="activeElement('emballage')">Emballages</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'articles'" (click)="activeElement('articles')">Articles</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'creatPrix'" (click)="activeElement('creatPrix')">Liste des prix</button>
</div>

<div *ngIf="activeTab === 'groupeProduits'">
  <app-groupe-produit></app-groupe-produit>
</div>

<div *ngIf="activeTab === 'typeArticle'">
  <app-type-article></app-type-article>
</div>

<div *ngIf="activeTab === 'liquide'">
  <app-liquide></app-liquide>
</div>

<div *ngIf="activeTab === 'emballage'">
  <app-emballage></app-emballage>
</div>

<div *ngIf="activeTab === 'articles'">
  <app-article></app-article>
</div>

<div *ngIf="activeTab === 'creatPrix'">
  <app-creation-prix></app-creation-prix>
</div>
