<div class="cc-list-card">
  <div class="cc-list-topbar">
    <span class="cc-list-count">{{ totalPages }} type(s) article</span>
    <button class="cc-btn-primary" type="button" (click)="OnCreate()">
      <i class="fas fa-plus me-2"></i>Ajouter un type article
    </button>
  </div>
  <div class="cc-filters">
    <div class="cc-filter-item">
      <span class="cc-filter-label">Libellé</span>
      <div class="cc-filter-input-wrap">
        <i class="fas fa-search cc-filter-icon"></i>
        <input class="cc-filter-input" type="text" [(ngModel)]="filters.libelle" (keydown.enter)="filterGlobal()" placeholder="Recherche…">
      </div>
    </div>
    <div>
      <button class="cc-btn-search" type="button" (click)="filterGlobal()">
        <i class="fas fa-search me-1"></i> Rechercher
      </button>
    </div>
  </div>
  <p-table [styleClass]="'cc-ptable p-datatable-sm'" #dt2 [value]="dataList" dataKey="id" [rows]="8" [totalRecords]="totalPages" [lazy]="true"
      [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Code article</th>
        <th>Libellé</th>
        <th>Date création</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.code }}</td>
        <td>{{ row.libelle }}</td>
        <td>{{ row.createdAt | date }}</td>
        <td class="text-center">
          <div style="display:flex;gap:6px;justify-content:center">
            <button class="cc-action-btn edit" (click)="OnEdit(row)" title="Modifier"><i class="fas fa-edit"></i></button>
            <button class="cc-action-btn del" (click)="OnDelete(row.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">
          <i class="fas fa-tags" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>
          Aucun type article trouvé.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="cc-modal">
    <div class="cc-modal-header">
      <div class="cc-modal-icon"><i class="fas fa-tags"></i></div>
      <h5 class="cc-modal-title">
        {{ operation === 'create' ? 'Création d\'un type article' : 'Modification du type article' }}
      </h5>
      <button class="cc-modal-close" (click)="OnCloseModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="cc-modal-body">
      <form [formGroup]="articleForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">
          <div class="cc-field">
            <label class="cc-field-label">Code *</label>
            <input class="cc-field-input" formControlName="code" placeholder="Entrez le code" />
          </div>
          <div class="cc-field">
            <label class="cc-field-label">Nom du type article *</label>
            <input class="cc-field-input" formControlName="libelle" placeholder="Entrez le type article" />
          </div>
        </div>
      </form>
    </div>
    <div class="cc-modal-footer">
      <button class="cc-btn-secondary" (click)="OnCloseModal()">Annuler</button>
      <button class="cc-btn-submit" (click)="onSubmit()">
        <i class="fas fa-check"></i> {{ operation === 'create' ? 'Créer' : 'Enregistrer' }}
      </button>
    </div>
  </div>
</div>
