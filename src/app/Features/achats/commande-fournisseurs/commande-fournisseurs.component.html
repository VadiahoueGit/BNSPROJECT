<div class="cof-back-row" (click)="goBack()">
  <div class="cof-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="cof-back-title">Commandes fournisseurs</h4>
</div>

<div class="cof-tabs mb-3">
  <button class="cof-tab-btn" [class.active]="activeTab === 'saisiecommande'" (click)="activeElement('saisiecommande')">Saisie commande</button>
  <button class="cof-tab-btn" [class.active]="activeTab === 'validationcommmande'" (click)="activeElement('validationcommmande')">Validation commande</button>
</div>

<div *ngIf="activeTab === 'saisiecommande'">
  <app-create-commande-fournisseurs></app-create-commande-fournisseurs>
</div>

<div *ngIf="activeTab === 'validationcommmande'">
  <app-validation-commande></app-validation-commande>
</div>
