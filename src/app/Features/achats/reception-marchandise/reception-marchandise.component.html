<div class="bui-back mb-4" (click)="goBack()">
  <div class="bui-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="fw-bold mb-0">Réception marchandises</h4>
</div>

<div class="cc-tabs mb-3">
  <button class="cc-tab-btn" [class.active]="activeTab === 'saisiecommande'" (click)="activeElement('saisiecommande')">Commandes</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'emballages'" (click)="activeElement('emballages')">Emballages</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'receptionmarchandise'" (click)="activeElement('receptionmarchandise')">Réception marchandises</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'entreegratuite'" (click)="activeElement('entreegratuite')">Entrée gratuite</button>
</div>

<div *ngIf="activeTab === 'saisiecommande'">
  <app-liste-commandes-marchandises></app-liste-commandes-marchandises>
</div>

<div *ngIf="activeTab === 'emballages'">
  <app-list-emballages></app-list-emballages>
</div>

<div *ngIf="activeTab === 'receptionmarchandise'">
  <app-list-reception-marchandise></app-list-reception-marchandise>
</div>

<div *ngIf="activeTab === 'entreegratuite'">
  <app-saisie-entree-gratuites [ListenMode]="true"></app-saisie-entree-gratuites>
</div>
