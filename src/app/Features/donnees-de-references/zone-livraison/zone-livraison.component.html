<div class="zl-header">
  <div class="zl-title">
    <button class="zl-back-btn" (click)="goBack()"><i class="fas fa-chevron-left"></i></button>
    <h4>Zones de livraison</h4>
  </div>
  <button class="zl-btn-primary" (click)="OnCreate()">
    <i class="fas fa-plus"></i> Nouvelle zone
  </button>
</div>

<div class="zl-card">
  <div class="zl-topbar">
    <div>
      <div class="zl-card-title"><i class="fas fa-route"></i> Liste des zones de livraison</div>
      <div class="zl-count">{{ dataList.length }} résultat(s)</div>
    </div>
  </div>

  <p-table [styleClass]="'zl-ptable p-datatable-sm'" [value]="dataList" dataKey="id"
           [totalRecords]="totalPages" [lazy]="true" [rows]="8"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Zone</th>
        <th>Localité</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td><span class="zl-name">{{ row.nomZone }}</span></td>
        <td>
          <span class="zl-loc-badge"><i class="fas fa-map-marker-alt"></i>{{ row.localite.nomLocalite }}</span>
        </td>
        <td class="text-center">
          <div style="display:flex;gap:6px;justify-content:center">
            <button class="zl-action-btn edit" (click)="OnEdit(row)" title="Modifier"><i class="fas fa-edit"></i></button>
            <button class="zl-action-btn del" (click)="OnDelete(row.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">
          <i class="fas fa-route" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>
          Aucune zone trouvée.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="zl-modal">
    <div class="zl-modal-header">
      <div class="zl-modal-icon"><i class="fas fa-route"></i></div>
      <h5 class="zl-modal-title">
        {{ operation === 'create' ? 'Nouvelle zone de livraison' : 'Modifier la zone de livraison' }}
      </h5>
      <button class="zl-modal-close" (click)="OnCloseModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="zl-modal-body">
      <form [formGroup]="zoneForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">
          <div class="zl-field">
            <label class="zl-field-label">Zone *</label>
            <input class="zl-field-input" formControlName="nomZone" placeholder="Entrez la zone" />
          </div>
          <div class="zl-field">
            <label class="zl-field-label">Localité *</label>
            <select class="zl-field-select" formControlName="localite">
              <option value="" disabled selected>Choisir la localité</option>
              <option [value]="item.id" *ngFor="let item of dataListlocalite">{{ item.nomLocalite }}</option>
            </select>
          </div>
        </div>
      </form>
    </div>
    <div class="zl-modal-footer">
      <button class="zl-btn-secondary" (click)="OnCloseModal()">Annuler</button>
      <button class="zl-btn-submit" (click)="onSubmit()">
        <i class="fas fa-check"></i> {{ operation === 'create' ? 'Créer' : 'Enregistrer' }}
      </button>
    </div>
  </div>
</div>
