<div class="loc-header">
  <div class="loc-title">
    <button class="loc-back-btn" (click)="goBack()"><i class="fas fa-chevron-left"></i></button>
    <h4>Localités</h4>
  </div>
  <button class="loc-btn-primary" (click)="OnCreate()">
    <i class="fas fa-plus"></i> Nouvelle localité
  </button>
</div>

<div class="loc-card">
  <div class="loc-topbar">
    <div>
      <div class="loc-card-title"><i class="fas fa-map-marker-alt"></i> Liste des localités</div>
      <div class="loc-count">{{ dataList.length }} résultat(s)</div>
    </div>
  </div>

  <p-table [styleClass]="'loc-ptable p-datatable-sm'" [value]="dataList" dataKey="id"
           [totalRecords]="totalPages" [lazy]="true" [rows]="8"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Localité</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td><span class="loc-code-badge">{{ row.codeLocalite ?? '—' }}</span></td>
        <td><span class="loc-name">{{ row.nomLocalite }}</span></td>
        <td class="text-center">
          <div style="display:flex;gap:6px;justify-content:center">
            <button class="loc-action-btn edit" (click)="OnEdit(row)" title="Modifier"><i class="fas fa-edit"></i></button>
            <button class="loc-action-btn del" (click)="OnDelete(row.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">
          <i class="fas fa-map-marker-alt" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>
          Aucune localité trouvée.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="loc-modal">
    <div class="loc-modal-header">
      <div class="loc-modal-icon"><i class="fas fa-map-marker-alt"></i></div>
      <h5 class="loc-modal-title">
        {{ operation === 'create' ? 'Nouvelle localité' : 'Modifier la localité' }}
      </h5>
      <button class="loc-modal-close" (click)="OnCloseModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="loc-modal-body">
      <form [formGroup]="LocaliteForm">
        <div class="loc-field">
          <label class="loc-field-label">Localité *</label>
          <input class="loc-field-input" formControlName="nomLocalite" placeholder="Entrez la localité" />
        </div>
      </form>
    </div>
    <div class="loc-modal-footer">
      <button class="loc-btn-secondary" (click)="OnCloseModal()">Annuler</button>
      <button class="loc-btn-submit" (click)="onSubmit()">
        <i class="fas fa-check"></i> {{ operation === 'create' ? 'Créer' : 'Enregistrer' }}
      </button>
    </div>
  </div>
</div>
