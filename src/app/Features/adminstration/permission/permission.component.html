<div class="card">
  <div class="d-flex justify-content-end py-3">
  <button type="button" class="bui-btn-add" (click)="OnCreate()">Créer une permission</button>
</div>
  <p-table [styleClass]="'p-datatable-sm'" #dt2 [value]="dataList" dataKey="id" [rows]="8" [totalRecords]="totalPages"
           [lazy]="true" [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">

    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Descriptions</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-dataList>
      <tr>
        <td>
          {{ dataList.name }}
        </td>
        <td>
          <span class="ml-1 vertical-align-middle">
            {{ dataList.description }}
          </span>
        </td>
        <td class="text-center">
          <div class="d-flex justify-content-center gap-2">
            <span class="bui-icon-btn edit" (click)="OnEdit(dataList)"><i class="fas fa-edit"></i></span><span class="bui-icon-btn delete" (click)="OnDelete(dataList.id)"><i class="fas fa-trash-alt"></i></span>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5">Aucune permission trouvée.</td>
      </tr>
    </ng-template>
  </p-table>
</div>


<!-- Modal creation -->
<!-- Modal -->
<div *ngIf="isModalOpen" class="custom-modal">
  <div class="modal-dialog  modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header d-flex align-items-center">
        <div class="bui-modal-icon"><i class="fas fa-box-check text-primary fs-3"></i></div>
        <h1 *ngIf="operation == 'create'" class="modal-title fs-5 ms-3" id="staticBackdropLabel">Création
          de permissions</h1>
        <h1 *ngIf="operation == 'edit'" class="modal-title fs-5 ms-3" id="staticBackdropLabel">Modification de permissions</h1>
      </div>
      <div class="modal-body">
        <form [formGroup]="UserForm">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="nom" class="form-label">Code <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nom" formControlName="name" placeholder="Entrez le nom">
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3">
                <label for="matricule" class="form-label">Description <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="matricule" formControlName="description"
                       placeholder="Entrez le code">

              </div>
            </div>
          </div>
        </form>
      </div>


      <div class="modal-footer gap-3 px-4">
        <button (click)="OnCloseModal()" type="button" class="btn btn-secondary px-2">Annuler</button>
        <button type="submit" [disabled]="UserForm.invalid" (click)="onSubmit()"
                class="btn btn-primary px-2">Valider</button>
      </div>
    </div>
  </div>
</div>
