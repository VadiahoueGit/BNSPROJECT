<div class="prm-card">
  <div class="prm-topbar">
    <span class="prm-title">Permissions</span>
    <button type="button" class="prm-btn-add" (click)="OnCreate()">
      <i class="fas fa-plus me-1"></i> Créer une permission
    </button>
  </div>

  <p-table [styleClass]="'prm-ptable p-datatable-sm'" #dt2 [value]="dataList" dataKey="id"
           [rows]="8" [totalRecords]="totalPages" [lazy]="true"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-dataList>
      <tr>
        <td>{{ dataList.name }}</td>
        <td>{{ dataList.description }}</td>
        <td>
          <div class="prm-actions">
            <button class="prm-action-btn edit" (click)="OnEdit(dataList)" title="Modifier"><i class="fas fa-pen"></i></button>
            <button class="prm-action-btn del" (click)="OnDelete(dataList.id)" title="Supprimer"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="3">Aucune permission trouvée.</td></tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="isModalOpen" class="custom-modal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header d-flex align-items-center">
        <div class="bui-modal-icon"><i class="fas fa-box-check text-primary fs-3"></i></div>
        <h1 *ngIf="operation == 'create'" class="modal-title fs-5 ms-3">Création de permissions</h1>
        <h1 *ngIf="operation == 'edit'" class="modal-title fs-5 ms-3">Modification de permissions</h1>
      </div>
      <div class="modal-body">
        <form [formGroup]="UserForm">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Code <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="name" placeholder="Entrez le nom">
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Description <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="description" placeholder="Entrez la description">
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer gap-3 px-4">
        <button (click)="OnCloseModal()" type="button" class="btn btn-secondary px-2">Annuler</button>
        <button type="submit" [disabled]="UserForm.invalid" (click)="onSubmit()" class="btn btn-primary px-2">Valider</button>
      </div>
    </div>
  </div>
</div>
