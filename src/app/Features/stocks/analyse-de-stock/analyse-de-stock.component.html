<div class="bui-back mb-4" (click)="goBack()">
  <div class="bui-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="fw-bold mb-0">Analyse de stock</h4>
</div>

<div class="card">
  <p-table [styleClass]="'p-datatable-sm'" #dt [value]="dataList" dataKey="id"
           [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true"
           [globalFilterFields]="['date', 'partenaire', 'articles', 'magasin']"
           (onPage)="onPage($event)">
    <ng-template pTemplate="caption">
      <div class="bui-caption">
        <div class="bui-search">
          <i class="fas fa-search"></i>
          <input class="bui-search-input" type="text"
                 (input)="filterGlobal($event)" placeholder="Rechercher...">
        </div>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th>Date</th>
        <th>Partenaire</th>
        <th>Article</th>
        <th>Magasin</th>
        <th>Type de mouvement</th>
      </tr>
      <tr>
        <th><p-columnFilter type="text" field="date" placeholder="Date" /></th>
        <th><p-columnFilter type="text" field="partenaire" placeholder="Partenaire" /></th>
        <th><p-columnFilter type="text" field="article" placeholder="Article" /></th>
        <th><p-columnFilter type="text" field="magasin" placeholder="Magasin" /></th>
        <th><p-columnFilter type="text" field="mouvement" placeholder="Type" /></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData>
      <tr>
        <td>{{ rowData.date }}</td>
        <td>{{ rowData.partenaire }}</td>
        <td>{{ rowData.article }}</td>
        <td>{{ rowData.magasin }}</td>
        <td>{{ rowData.mouvement }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" style="text-align:center;padding:24px;color:#9ca3af">
          <i class="fas fa-chart-bar me-2"></i>Aucun mouvement trouvé
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
