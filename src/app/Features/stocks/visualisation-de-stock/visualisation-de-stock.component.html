<div class="bui-back mb-4" (click)="goBack()">
  <div class="bui-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="fw-bold mb-0">Visualisation des stocks</h4>
</div>

<div class="card">
  <p-table [styleClass]="'p-datatable-sm'" #dt2 [value]="dataList" dataKey="id"
           [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true"
           [globalFilterFields]="['code', 'libelle', 'totalQuantity']"
           (onPage)="onPage($event)">
    <ng-template pTemplate="caption">
      <div class="bui-caption">
        <div class="bui-search">
          <i class="fas fa-search"></i>
          <input class="bui-search-input" type="text"
                 (input)="filterGlobal($event)" placeholder="Rechercher...">
        </div>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th>Code article</th>
        <th>Description</th>
        <th>Stock total</th>
        <th>Disponibilité par dépôt</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData>
      <tr>
        <td>{{ rowData.code }}</td>
        <td>{{ rowData.libelle }}</td>
        <td><strong>{{ rowData.totalQuantity }}</strong></td>
        <td>
          <ul class="sk-depot-list">
            <li *ngFor="let elt of rowData.stockByDepot">
              <span class="sk-depot-name">{{ elt.depot }}</span>
              <span class="sk-depot-qty">{{ elt.quantity }}</span>
            </li>
          </ul>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" style="text-align:center;padding:24px;color:#9ca3af">
          <i class="fas fa-boxes me-2"></i>Aucun stock trouvé
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
