<div class="bui-back mb-4" (click)="goBack()">
  <div class="bui-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="fw-bold mb-0">Sortie de stock</h4>
</div>

<div class="card">
  <form [formGroup]="stockForm">
    <div class="sk-form-grid">
      <div class="sk-field">
        <label class="sk-label">Numéro</label>
        <input type="text" class="sk-input" formControlName="numero" [attr.disabled]="true" readonly>
      </div>
      <div class="sk-field">
        <label class="sk-label">Dépôt <span class="text-danger">*</span></label>
        <ng-select [items]="depotList" bindLabel="nomDepot" bindValue="id"
                   formControlName="depotId" [searchable]="true"
                   (change)="deselectAllItems()">
        </ng-select>
      </div>
      <div class="sk-field">
        <label class="sk-label">Date d'enregistrement <span class="text-danger">*</span></label>
        <input type="date" class="sk-input" formControlName="dateEnregistrement">
      </div>
      <div class="sk-field">
        <label class="sk-label">Date de document <span class="text-danger">*</span></label>
        <input type="date" class="sk-input" formControlName="dateDocument">
      </div>
      <div class="sk-field sk-full">
        <label class="sk-label">Commentaire</label>
        <textarea class="sk-input sk-textarea" formControlName="commentaire" rows="3"
                  placeholder="Commentaire optionnel..."></textarea>
      </div>
    </div>
  </form>

  <div class="sk-articles-section">
    <div class="sk-articles-header">
      <span class="sk-articles-title"><i class="fas fa-boxes me-2"></i>Articles</span>
      <button type="button" class="sk-btn-add"
              [disabled]="stockForm.controls['depotId'].invalid"
              (click)="OnCreate()">
        <i class="fas fa-plus me-1"></i> Ajouter des articles
      </button>
    </div>
    <div class="sk-table-wrap">
      <table class="sk-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Description</th>
            <th>Quantité</th>
            <th>Qté disponible</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of selectedArticles">
            <td>{{ data.code || data.reference }}</td>
            <td>{{ data.libelle }}</td>
            <td>
              <input type="number" class="sk-qty-input"
                     [(ngModel)]="data.quantite"
                     [min]="0"
                     [max]="stocksDisponibles[data.id]"
                     [disabled]="stocksDisponibles[data.id] === 0"
                     [ngClass]="{ 'invalid': data.quantite > stocksDisponibles[data.id] }"
                     (ngModelChange)="validateQuantite(data)">
            </td>
            <td>{{ stocksDisponibles[data.id] }}</td>
            <td class="text-center">
              <button type="button" class="sk-btn-danger" (click)="removeArticle(data)">
                <i class="fas fa-trash-alt"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="selectedArticles.length === 0">
            <td colspan="5" class="sk-empty-row">
              <i class="fas fa-box-open me-2"></i>Aucun article ajouté
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="sk-form-actions">
    <button type="button" class="sk-btn-primary" (click)="onSubmit()">
      <i class="fas fa-save me-2"></i>Enregistrer
    </button>
  </div>
</div>

<!-- Modal sélection articles -->
<div *ngIf="isModalOpen" class="custom-modal">
  <div class="sk-modal">
    <div class="sk-modal-header">
      <div class="sk-modal-icon"><i class="fas fa-boxes"></i></div>
      <h5 class="sk-modal-title">Sélection des articles</h5>
      <button class="sk-modal-close" (click)="OnCloseModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="sk-modal-body">
      <div class="sk-search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" class="sk-search-input" [(ngModel)]="searchTerm"
               (input)="filterArticles()" placeholder="Rechercher un article...">
      </div>
      <div class="sk-table-wrap">
        <table class="sk-modal-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Produit</th>
              <th class="text-center">Choix</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let article of filteredArticleList; let i = index">
              <td>{{ article.code || article.reference }}</td>
              <td>{{ article.libelle }}</td>
              <td class="text-center">
                <input type="checkbox" [name]="'checkbox_' + i"
                       [(ngModel)]="article.isChecked" (change)="onCheckboxChange(article)">
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="sk-modal-footer">
      <button class="sk-btn-secondary" (click)="OnCloseModal()">Annuler</button>
      <button class="sk-btn-primary" (click)="onSubmitSelection()">
        <i class="fas fa-check me-1"></i> Valider
      </button>
    </div>
  </div>
</div>
