<div class="vco-back-row" (click)="goBack()">
  <div class="vco-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="vco-back-title">Visites commerciales</h4>
</div>

<div class="vco-tabs mb-3">
  <button class="vco-tab-btn" [class.active]="activeTab === 'gestvisit'" (click)="activeElement('gestvisit')">Gestion des visites</button>
  <button class="vco-tab-btn" [class.active]="activeTab === 'progvisite'" (click)="activeElement('progvisite')">Visites programmées</button>
  <button class="vco-tab-btn" [class.active]="activeTab === 'svisite'" (click)="activeElement('svisite')">Suivi des visites</button>
</div>

<div *ngIf="activeTab === 'gestvisit'">
  <app-gestionvisite></app-gestionvisite>
</div>

<div *ngIf="activeTab === 'progvisite'">
  <app-programmation></app-programmation>
</div>

<div *ngIf="activeTab === 'svisite'">
  <app-suivivisite></app-suivivisite>
</div>
