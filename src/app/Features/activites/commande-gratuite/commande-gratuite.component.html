<div class="cgt-back-row" (click)="goBack()">
  <div class="cgt-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="cgt-back-title">Commandes gratuites</h4>
</div>

<div class="cgt-tabs mb-3">
  <button class="cgt-tab-btn" [class.active]="activeTab === 'saisiecommande'" (click)="activeElement('saisiecommande')">Saisie commande</button>
  <button class="cgt-tab-btn" [class.active]="activeTab === 'suivicommmande'" (click)="activeElement('suivicommmande')">Suivi commande</button>
</div>

<div *ngIf="activeTab === 'saisiecommande'">
  <app-saisie-commande-gratuite></app-saisie-commande-gratuite>
</div>

<div *ngIf="activeTab === 'suivicommmande'">
  <app-suivi-commande-gratuite></app-suivi-commande-gratuite>
</div>
