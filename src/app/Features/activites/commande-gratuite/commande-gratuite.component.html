<div class="bui-back mb-4" (click)="goBack()">
  <div class="bui-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="fw-bold mb-0">Commandes gratuites</h4>
</div>

<div class="cc-tabs mb-3">
  <button class="cc-tab-btn" [class.active]="activeTab === 'saisiecommande'" (click)="activeElement('saisiecommande')">Saisie commande</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'suivicommmande'" (click)="activeElement('suivicommmande')">Suivi commande</button>
</div>

<div *ngIf="activeTab === 'saisiecommande'">
  <app-saisie-commande-gratuite></app-saisie-commande-gratuite>
</div>

<div *ngIf="activeTab === 'suivicommmande'">
  <app-suivi-commande-gratuite></app-suivi-commande-gratuite>
</div>
