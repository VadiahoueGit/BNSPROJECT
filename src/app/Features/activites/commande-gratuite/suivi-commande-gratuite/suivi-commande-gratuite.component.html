<!-- Card + Table -->
<div class="sucg-card">
  <div class="sucg-topbar">
    <div>
      <div class="sucg-card-title"><i class="fas fa-list-check"></i> Suivi des commandes gratuites</div>
      <div class="sucg-count">{{ dataList?.length || 0 }} commande(s)</div>
    </div>
  </div>

  <p-table [styleClass]="'sucg-ptable p-datatable-sm'" #dt2 [value]="dataList" dataKey="id" [rows]="8"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>N° Commande</th>
        <th>Montant (FCFA)</th>
        <th>Type de commande</th>
        <th>N° commande</th>
        <th>Statut</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-dataList>
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">
          <i class="fas fa-list-check" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>
          Aucune commande trouvée.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
