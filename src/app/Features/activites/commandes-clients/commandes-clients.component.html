<!-- ===== HEADER ===== -->
<div class="d-flex align-items-center justify-content-between mb-4">
  <div class="d-flex align-items-center gap-3" style="cursor:pointer" (click)="goBack()">
    <div class="cc-back-btn">
      <i class="fas fa-chevron-left"></i>
    </div>
    <div>
      <h4 class="fw-bold mb-0">Commandes clients</h4>
    </div>
  </div>
</div>

<!-- ===== TABS ===== -->
<div class="cc-tabs mb-4">
  <button class="cc-tab-btn" [class.active]="activeTab === 'saisiecommande'" (click)="activeElement('saisiecommande')">
    <i class="fas fa-file-alt me-2"></i> Saisie commande
  </button>
</div>

<!-- ===== CONTENT ===== -->
<div *ngIf="activeTab === 'saisiecommande'">
  <app-saisie-commande></app-saisie-commande>
</div>

<div *ngIf="activeTab === 'suivicommmande'">
  <app-suivi-commande></app-suivi-commande>
</div>

<div *ngIf="activeTab === 'validationcommande'">
  <app-validation-commande></app-validation-commande>
</div>
