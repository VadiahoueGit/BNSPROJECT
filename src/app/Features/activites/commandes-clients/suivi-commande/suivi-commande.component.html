<!-- Card + Table -->
<div class="sc-card">
  <div class="sc-topbar">
    <div>
      <div class="sc-card-title"><i class="fas fa-list-alt"></i> Suivi des commandes</div>
      <div class="sc-count">{{ dataList?.length || 0 }} commande(s)</div>
    </div>
  </div>

  <p-table [styleClass]="'sc-ptable p-datatable-sm'" #dt2 [value]="dataList" dataKey="id" [rows]="8"
           [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Date</th>
        <th>N° commande</th>
        <th>N° SAP</th>
        <th>Raison sociale</th>
        <th>Montant liquide</th>
        <th>Montant emballage</th>
        <th>Entrepôt</th>
        <th>Localité à livrer</th>
        <th>Date livraison</th>
        <th>Statut</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-dataList>
      <tr>
        <td></td><td></td><td></td><td></td><td></td>
        <td></td><td></td><td></td><td></td><td></td>
        <td class="text-center">
          <div style="display:flex;gap:6px;justify-content:center">
            <button class="sc-action-btn edit" (click)="OnEdit(dataList)" title="Modifier"><i class="fas fa-edit"></i></button>
            <button class="sc-action-btn del" (click)="OnDelete(dataList.id)" title="Supprimer"><i class="fas fa-trash-alt"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="11" style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">
          <i class="fas fa-list-alt" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>
          Aucune commande trouvée.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
