<div class="gdr-back-row" (click)="goBack()">
  <div class="gdr-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="gdr-back-title">Gestion des retours</h4>
</div>

<div class="gdr-tabs mb-3">
  <button class="gdr-tab-btn" [class.active]="activeTab === 'suiviRdv'" (click)="activeElement('suiviRdv')">Suivi des Rdv</button>
  <button class="gdr-tab-btn" [class.active]="activeTab === 'consigne'" (click)="activeElement('consigne')">Consignes</button>
  <button class="gdr-tab-btn" [class.active]="activeTab === 'receptionEmallage'" (click)="activeElement('receptionEmallage')">Réceptions emballages</button>
  <button class="gdr-tab-btn" [class.active]="activeTab === 'retourPlein'" (click)="activeElement('retourPlein')">Retour plein</button>
  <button class="gdr-tab-btn" [class.active]="activeTab === 'listReceptionEmallage'" (click)="activeElement('listReceptionEmallage')">Regroupement/agents</button>
  <button class="gdr-tab-btn" [class.active]="activeTab === 'regroupementRetourPlein'" (click)="activeElement('regroupementRetourPlein')">Regroupement Retour Plein</button>
  <button class="gdr-tab-btn" [class.active]="activeTab === 'ecartEmballage'" (click)="activeElement('ecartEmballage')">Ecart</button>
  <button class="gdr-tab-btn" [class.active]="activeTab === 'recuperationEmballagesRdv'" (click)="activeElement('recuperationEmballagesRdv')">Récupération emballages RDV</button>
</div>

<div *ngIf="activeTab === 'suiviRdv'">
  <app-suivi-des-rdv></app-suivi-des-rdv>
</div>

<div *ngIf="activeTab === 'consigne'">
  <app-consigne></app-consigne>
</div>

<div *ngIf="activeTab === 'receptionEmallage'">
  <app-receptions-emballages></app-receptions-emballages>
</div>

<div *ngIf="activeTab === 'retourPlein'">
  <app-retour-plein></app-retour-plein>
</div>

<div *ngIf="activeTab === 'listReceptionEmallage'">
  <app-list-des-receptions-emballages></app-list-des-receptions-emballages>
</div>

<div *ngIf="activeTab === 'regroupementRetourPlein'">
  <app-regroupement-retour-plein></app-regroupement-retour-plein>
</div>

<div *ngIf="activeTab === 'regroupementEmballages'">
  <app-regroupement-emballages></app-regroupement-emballages>
</div>

<div *ngIf="activeTab === 'ecartEmballage'">
  <app-ecart-emballage></app-ecart-emballage>
</div>

<div *ngIf="activeTab === 'recuperationEmballagesRdv'">
  <app-recuperation-emballages-rdv></app-recuperation-emballages-rdv>
</div>
