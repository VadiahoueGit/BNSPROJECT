<div class="sk-hub">
  <div class="sk-hub-header">
    <h2 class="sk-hub-title">Activités</h2>
    <p class="sk-hub-subtitle">Sélectionnez une fonctionnalité</p>
  </div>
  <div class="sk-hub-grid">
    <ng-container *ngFor="let item of ListItems">
      <div *ngIf="hasPermission(item.perm)" class="sk-hub-card" (click)="displayItem(item)">
        <div class="sk-hub-card-icon">
          <img [src]="item.image" [alt]="item.title">
        </div>
        <div class="sk-hub-card-body">
          <span class="sk-hub-card-label">{{ item.title }}</span>
        </div>
        <i class="fas fa-chevron-right sk-hub-card-arrow"></i>
      </div>
    </ng-container>
  </div>
</div>
