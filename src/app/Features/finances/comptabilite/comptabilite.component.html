<div class="bui-back mb-4" (click)="goBack()">
  <div class="bui-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="fw-bold mb-0">Comptabilité</h4>
</div>

<div class="cc-tabs mb-3">
  <button class="cc-tab-btn" [class.active]="activeTab === 'suiviCompte'" (click)="activeElement('suiviCompte')">Suivi des comptes</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'sousCompte'" (click)="activeElement('sousCompte')">Sous comptes</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'paiementEnAttente'" (click)="activeElement('paiementEnAttente')">Paiements en attente</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'validationPaiement'" (click)="activeElement('validationPaiement')">Validation des paiements</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'commandeGroupe'" (click)="activeElement('commandeGroupe')">Validation agent</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'commandePayees'" (click)="activeElement('commandePayees')">Commande payées</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'creance'" (click)="activeElement('creance')">Créances</button>
</div>

<div *ngIf="activeTab === 'suiviCompte'">
  <app-suivi-comptes></app-suivi-comptes>
</div>

<div *ngIf="activeTab === 'sousCompte'">
  <app-sous-compte></app-sous-compte>
</div>

<div *ngIf="activeTab === 'paiementEnAttente'">
  <app-paiementenattente></app-paiementenattente>
</div>

<div *ngIf="activeTab === 'validationPaiement'">
  <app-validation-paiements></app-validation-paiements>
</div>

<div *ngIf="activeTab === 'commandePayeesPatiellement'">
  <app-commande-payes-partiellement></app-commande-payes-partiellement>
</div>

<div *ngIf="activeTab === 'commandeGroupe'">
  <app-paiement-groupe></app-paiement-groupe>
</div>

<div *ngIf="activeTab === 'commandePayees'">
  <app-commande-payes></app-commande-payes>
</div>

<div *ngIf="activeTab === 'creance'">
  <app-ecart></app-ecart>
</div>
