<div class="val-back-row" (click)="goBack()">
  <div class="val-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="val-back-title">Validation</h4>
</div>

<div class="val-tabs mb-3">
  <button class="val-tab-btn" [class.active]="activeTab === 'validationVenteChine'" (click)="activeElement('validationVenteChine')">Ventes chine</button>
  <button class="val-tab-btn" [class.active]="activeTab === 'validationCommandeGratuite'" (click)="activeElement('validationCommandeGratuite')">Commandes gratuite</button>
  <button class="val-tab-btn" [class.active]="activeTab === 'validationCommandeClient'" (click)="activeElement('validationCommandeClient')">Commandes client</button>
</div>

<div *ngIf="activeTab === 'validationVenteChine'">
  <app-validation-vente-chine></app-validation-vente-chine>
</div>

<div *ngIf="activeTab === 'validationCommandeGratuite'">
  <app-validation-commande-gratuite></app-validation-commande-gratuite>
</div>

<div *ngIf="activeTab === 'validationCommandeClient'">
  <app-validation-commande-client></app-validation-commande-client>
</div>
