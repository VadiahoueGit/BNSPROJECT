<div class="cai-back-row" (click)="goBack()">
  <div class="cai-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="cai-back-title">Caisse</h4>
</div>

<div class="cai-tabs mb-3">
  <button class="cai-tab-btn" [class.active]="activeTab === 'brouillard'" (click)="activeElement('brouillard')">Brouillard de caisse</button>
  <button class="cai-tab-btn" [class.active]="activeTab === 'comptes'" (click)="activeElement('comptes')">Comptes</button>
  <button class="cai-tab-btn" [class.active]="activeTab === 'recouvrement'" (click)="activeElement('recouvrement')">Recouvrement</button>
</div>

<div *ngIf="activeTab === 'brouillard'">
  <app-brouillard></app-brouillard>
</div>

<div *ngIf="activeTab === 'comptes'">
  <app-comptes></app-comptes>
</div>

<div *ngIf="activeTab === 'recouvrement'">
  <app-recouvrement></app-recouvrement>
</div>
