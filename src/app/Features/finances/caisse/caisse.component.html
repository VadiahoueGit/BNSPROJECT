<div class="bui-back mb-4" (click)="goBack()">
  <div class="bui-back-icon"><i class="fas fa-chevron-left"></i></div>
  <h4 class="fw-bold mb-0">Caisse</h4>
</div>

<div class="cc-tabs mb-3">
  <button class="cc-tab-btn" [class.active]="activeTab === 'brouillard'" (click)="activeElement('brouillard')">Brouillard de caisse</button>
  <button class="cc-tab-btn" [class.active]="activeTab === 'comptes'" (click)="activeElement('comptes')">Comptes</button>
</div>

<div *ngIf="activeTab === 'brouillard'">
  <app-brouillard></app-brouillard>
</div>

<div *ngIf="activeTab === 'comptes'">
  <app-comptes></app-comptes>
</div>
