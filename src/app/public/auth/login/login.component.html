<div class="container-fluid vh-100 d-flex justify-content-center align-items-center"
     style="background-image: url('assets/image/bg-login.jpeg'); background-size: cover; background-position: center;">

  <div class="bg-white shadow rounded p-4 w-100" style="max-width: 400px;">
    <div class="text-center mb-3">
      <img src="assets/image/armonyssansfond.png" style="height: 70px;">
    </div>
    <h5 class="text-center mb-3 fw-bold">Connectez-vous</h5>
    <label class="mb-3 text-danger text-center fw-bold fs-2" *ngIf="testVersion">
      VERSION TEST
    </label>
    <label class="mb-3 text-black-50 text-center form-label">
      Bienvenue sur l'espace administrateur BEST NEGOCE SERVICE
    </label>
    <form [formGroup]="loginForm" (ngSubmit)="ToConnect()">
      <div class="mb-3">
        <label for="email" class="form-label">Adresse e-mail</label>
        <input type="email" formControlName="login" class="form-control" id="email" placeholder="Entrez votre e-mail">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" formControlName="password" class="form-control" id="password" placeholder="Entrez votre mot de passe">
        <label class="error my-3 text-danger d-block" *ngIf="submitError">Email ou mot de passe incorrect</label>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember">
        <label class="form-check-label" for="remember">Se souvenir de moi</label>
      </div>
      <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn btn-primary w-100">
        <span *ngIf="isLoading">Patientez ...</span>
        <span *ngIf="!isLoading">Se connecter</span>
      </button>
    </form>
    <p class="mt-3 text-primary text-center" style="cursor: pointer;" (click)="ToForgetPassword()">Mot de passe oublié ?</p>
  </div>

</div>

<!-- Modal création dépôt hôte (première connexion Société 2) -->
<div class="company-modal-overlay" *ngIf="showDepotHoteModal">
  <div class="company-modal depot-hote-modal">
    <div class="company-modal__header">
      <div class="depot-hote-icon">🏭</div>
      <h5 class="company-modal__title">Créer le dépôt hôte</h5>
      <p class="company-modal__sub">Aucun dépôt n'existe pour cette société. Créez-en un pour continuer.</p>
    </div>
    <form [formGroup]="depotHoteForm" (ngSubmit)="submitDepotHote()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nom du dépôt <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="nomDepot" placeholder="Ex: Dépôt Principal Abidjan">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Gérant <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="gerant" placeholder="Nom du gérant">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Téléphone <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="telephone" placeholder="Ex: 0700000000">
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="depotHoteForm.invalid || isCreatingDepot">
        <span *ngIf="isCreatingDepot">
          <span class="spinner-border spinner-border-sm me-2"></span>Création en cours...
        </span>
        <span *ngIf="!isCreatingDepot">Créer le dépôt et accéder à l'application</span>
      </button>
    </form>
  </div>
</div>

<!-- Modal choix de société (Super Admin uniquement) -->
<div class="company-modal-overlay" *ngIf="showCompanyModal">
  <div class="company-modal">
    <div class="company-modal__header">
      <h5 class="company-modal__title">Choisir l'entreprise</h5>
      <p class="company-modal__sub">Sélectionnez la société sur laquelle vous souhaitez travailler</p>
    </div>

    <!-- Chargement -->
    <div class="company-modal__loading" *ngIf="loadingCompanies">
      <div class="spinner-border spinner-border-sm text-primary me-2"></div>
      Chargement des sociétés...
    </div>

    <!-- Cartes sociétés -->
    <div class="company-modal__cards" *ngIf="!loadingCompanies">
      <button
        *ngFor="let c of companies"
        class="company-card"
        [disabled]="isSwitching"
        (click)="selectCompany(c.tenantId)">
        <div class="company-card__logo">
          <img *ngIf="c.logoPath" [src]="getLogoUrl(c.logoPath)" [alt]="c.nom">
          <span *ngIf="!c.logoPath" class="company-card__logo-placeholder">🏬</span>
        </div>
        <span class="company-card__label">{{ c.nom || 'Société' }}</span>
        <span class="company-card__arrow">›</span>
      </button>
    </div>

    <div class="company-modal__loading" *ngIf="isSwitching">
      <div class="spinner-border spinner-border-sm text-primary me-2"></div>
      Connexion en cours...
    </div>
  </div>
</div>
